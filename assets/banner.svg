<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Layer 1: Background & Grid Canvas -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />
  <rect width="1200" height="380" fill="url(#accentGlow)" />

  <!-- Layer 2: Dynamic Atmospheric Mesh & Sync Lines (Background Animation) -->
  <g opacity="0.45">
    <!-- Animated Network Node 1 (Left Cloud/Cluster) -->
    <circle cx="140" cy="110" r="48" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0 140 110" to="360 140 110" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="110" r="32" fill="#0369a1" fill-opacity="0.15" />
    <circle cx="140" cy="110" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="5;7.5;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Network Node 2 (Right Cluster) -->
    <circle cx="1060" cy="110" r="48" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 7">
      <animateTransform attributeName="transform" type="rotate" from="360 1060 110" to="0 1060 110" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="110" r="32" fill="#6d28d9" fill-opacity="0.15" />
    <circle cx="1060" cy="110" r="6" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Network Node 3 (Lower Center Left) -->
    <circle cx="280" cy="290" r="28" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 4">
      <animateTransform attributeName="transform" type="rotate" from="0 280 290" to="360 280 290" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="290" r="4" fill="#38bdf8" />

    <!-- Animated Network Node 4 (Lower Center Right) -->
    <circle cx="920" cy="290" r="28" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3 4">
      <animateTransform attributeName="transform" type="rotate" from="360 920 290" to="0 920 290" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="290" r="4" fill="#a855f7" />

    <!-- Transfer Connection Path 1 (Top Cross) -->
    <path d="M 140 110 C 350 40, 850 40, 1060 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Transfer Connection Path 2 (Node Interlinks) -->
    <path d="M 140 110 Q 210 200, 280 290" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="140" to="0" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 1060 110 Q 990 200, 920 290" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="140" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Dynamic Pulsing Packets -->
    <circle r="4" fill="#67e8f9" filter="url(#glow)">
      <animateMotion path="M 140 110 C 350 40, 850 40, 1060 110" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#e879f9" filter="url(#glow)">
      <animateMotion path="M 1060 110 C 850 40, 350 40, 140 110" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Layer 3: Central Ambient Halo (Keeps background warm but dark enough for text) -->
  <radialGradient id="centerBackdrop" cx="50%" cy="48%" r="42%">
    <stop offset="0%" stop-color="#030712" stop-opacity="0.9" />
    <stop offset="70%" stop-color="#050914" stop-opacity="0.75" />
    <stop offset="100%" stop-color="#0b1329" stop-opacity="0" />
  </radialGradient>
  <ellipse cx="600" cy="180" rx="460" ry="155" fill="url(#centerBackdrop)" />

  <!-- Layer 4: Floating Tech Pillars (Positioned symmetrically away from central text) -->
  <!-- Left Pill: P2P REPLICATION -->
  <g transform="translate(65, 205)">
    <animateTransform attributeName="transform" type="translate" values="65,205; 65,199; 65,205" dur="6s" repeatCount="indefinite" />
    <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="30" y="19" fill="#94a3b8" class="pill-text">P2P REPLICATION</text>
  </g>

  <!-- Left Pill 2: DELTA ENCODING -->
  <g transform="translate(100, 255)">
    <animateTransform attributeName="transform" type="translate" values="100,255; 100,261; 100,255" dur="5s" repeatCount="indefinite" />
    <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="16" cy="15" r="4.5" fill="#06b6d4" />
    <text x="30" y="19" fill="#94a3b8" class="pill-text">DELTA ENCODING</text>
  </g>

  <!-- Right Pill: BIDIRECTIONAL -->
  <g transform="translate(990, 205)">
    <animateTransform attributeName="transform" type="translate" values="990,205; 990,199; 990,205" dur="5.5s" repeatCount="indefinite" />
    <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="16" cy="15" r="4.5" fill="#c084fc" />
    <text x="30" y="19" fill="#cbd5e1" class="pill-text">BIDIRECTIONAL</text>
  </g>

  <!-- Right Pill 2: END-TO-END SYNC -->
  <g transform="translate(955, 255)">
    <animateTransform attributeName="transform" type="translate" values="955,255; 955,261; 955,255" dur="6.5s" repeatCount="indefinite" />
    <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="16" cy="15" r="4.5" fill="#a855f7" />
    <text x="30" y="19" fill="#cbd5e1" class="pill-text">ZERO KNOWLEDGE</text>
  </g>

  <!-- Layer 5: FOREGROUND CONTENT (Guaranteed on top of all dynamic elements) -->
  <g id="foreground-content">
    <!-- Top Sync Status Pill Badge -->
    <g transform="translate(485, 48)">
      <rect width="230" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <!-- Animated rotating mini sync icon -->
      <g transform="translate(20, 14)">
        <g>
          <path d="M -5 -3 A 6 6 0 0 1 5 -1 L 7 -3 L 6 2 L 1 1 L 3 -0.5 A 4 4 0 0 0 -4 -2 Z M 5 3 A 6 6 0 0 1 -5 1 L -7 3 L -6 -2 L -1 -1 L -3 0.5 A 4 4 0 0 0 4 2 Z" fill="#38bdf8" />
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
        </g>
      </g>
      <text x="36" y="18" fill="#38bdf8" class="pill-text">CONTINUOUS REPLICATION</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="138" text-anchor="middle" fill="url(#cyanPurpleGrad)" class="title-text" font-size="44" filter="url(#textGlow)">AWESOME FILE SYNCHRONIZATION</text>
    <text x="600" y="138" text-anchor="middle" fill="#ffffff" class="title-text" font-size="44">AWESOME FILE SYNCHRONIZATION</text>

    <!-- Tagline / Subtitle -->
    <text x="600" y="180" text-anchor="middle" fill="#cbd5e1" class="sub-text" font-size="16.5">
      The Curated Directory of P2P Replication, Continuous Sync &amp; Enterprise Data Mirroring
    </text>

    <text x="600" y="210" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="13.5">
      Open-Source Engines • Self-Hosted Cloud Storage • Hybrid Enterprise Sync • Delta Transfer
    </text>

    <!-- Central Feature Badges Row -->
    <g transform="translate(285, 255)">
      <!-- Badge 1: P2P Mesh -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="72" y="21" text-anchor="middle" fill="#38bdf8" class="pill-text">⚡ P2P MESH</text>
      </g>

      <!-- Badge 2: Delta Sync -->
      <g transform="translate(160, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="72" y="21" text-anchor="middle" fill="#818cf8" class="pill-text">🔄 REAL-TIME SYNC</text>
      </g>

      <!-- Badge 3: E2E Encrypted -->
      <g transform="translate(320, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="72" y="21" text-anchor="middle" fill="#c084fc" class="pill-text">🔒 ZERO TRUST</text>
      </g>

      <!-- Badge 4: Multi-Cloud -->
      <g transform="translate(480, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="72" y="21" text-anchor="middle" fill="#34d399" class="pill-text">🌐 MULTI-CLOUD</text>
      </g>
    </g>

    <!-- Footer Meta Pill -->
    <text x="600" y="338" text-anchor="middle" fill="#64748b" class="pill-text">
      CURATED ECOSYSTEM FOR DEVOPS, SYSADMINS &amp; PRIVACY ADVOCATES
    </text>
  </g>
</svg>
